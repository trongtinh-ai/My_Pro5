  <script>
    (function () {
      var l = null; try { l = localStorage.getItem('lang'); } catch (e) { }
      if (l !== 'vi' && l !== 'en') {
        var n = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
        l = /^vi(-|$)/i.test(n) ? 'vi' : 'en';
      }
      window.LANG = l;
      document.documentElement.lang = l;
    })();
  </script>
  <script>
    (function () {
      var s = null; try { s = localStorage.getItem('fxOff'); } catch (e) { }
      var rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
      var touch = matchMedia('(pointer: coarse)').matches;
      var lite = rm || (s === null ? touch : s === '1');
      window.FX = { lite: lite };
      if (lite) document.documentElement.classList.add('lite');
    })();
  </script>

<body>
  <!-- HUD boot overlay (click to skip) -->
  <div id="boot" aria-hidden="true">
    <div class="boot-box">
      <pre id="bootlog"></pre>
      <div class="boot-bar"><i id="bootbar"></i></div>
    </div>
  </div>
  <script>
    (function () {
      var b = document.getElementById('boot');
      if (window.FX && window.FX.lite) { b.remove(); return; }
      var root = document.documentElement, done = false;
      root.classList.add('booting');
      function finish() {
        if (done) return; done = true;
        root.classList.remove('booting');
        b.classList.add('out');
        setTimeout(function () { b.remove(); }, 650);
      }
      b.addEventListener('click', finish);
      addEventListener('keydown', finish, { once: true });
      setTimeout(finish, 5000);
      var lines = ['> INITIALIZING SYSTEM...', '> LOADING NEURAL CORE... OK', '> SYNCING PROFILE DATA... OK', '> ACCESS GRANTED'];
      var log = document.getElementById('bootlog'), text = '', li = 0, ci = 0;
      setTimeout(function () { document.getElementById('bootbar').style.width = '100%'; }, 60);
      (function step() {
        if (done) return;
        if (li >= lines.length) { b.classList.add('ok'); setTimeout(finish, 450); return; }
        var L = lines[li];
        if (ci < L.length) { ci++; log.textContent = text + L.slice(0, ci); setTimeout(step, 15); }
        else { text += L + '\n'; li++; ci = 0; setTimeout(step, 120); }
      })();
    })();
  </script>
